name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore
        run: dotnet restore LumenMedia.slnx

      - name: Build
        run: dotnet build LumenMedia.slnx -c Release --no-restore

      - name: Test
        run: dotnet test LumenMedia.slnx -c Release --no-build --verbosity normal

      - name: Publish API
        if: github.event_name == 'push'
        run: |
          dotnet publish src/LumenMedia.Api/LumenMedia.Api.csproj -c Release -o ./publish
          tar -C publish -czf lumenmedia-server-publish.tar.gz .

      - name: Upload publish artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: lumenmedia-server-publish
          path: lumenmedia-server-publish.tar.gz
          if-no-files-found: error

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build-test
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t lumenmedia-server:ci .

      - name: Save image
        if: github.event_name == 'push'
        run: docker save lumenmedia-server:ci | gzip > lumenmedia-server-image.tar.gz

      - name: Upload image artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: lumenmedia-server-image
          path: lumenmedia-server-image.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build-test, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download publish archive
        uses: actions/download-artifact@v8
        with:
          name: lumenmedia-server-publish

      - name: Download Docker image
        uses: actions/download-artifact@v8
        with:
          name: lumenmedia-server-image

      - name: Rename assets
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            mv lumenmedia-server-publish.tar.gz "lumenmedia-server-publish-${{ github.ref_name }}.tar.gz"
            mv lumenmedia-server-image.tar.gz "lumenmedia-server-image-${{ github.ref_name }}.tar.gz"
          else
            mv lumenmedia-server-publish.tar.gz lumenmedia-server-publish-nightly.tar.gz
            mv lumenmedia-server-image.tar.gz lumenmedia-server-image-nightly.tar.gz
          fi
          ls -lah lumenmedia-server-*.tar.gz

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Nightly' }}
          prerelease: ${{ github.ref_type != 'tag' }}
          make_latest: ${{ github.ref_type == 'tag' && true || false }}
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
          files: |
            lumenmedia-server-publish-*.tar.gz
            lumenmedia-server-image-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
