name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore
        run: dotnet restore LumenMedia.slnx

      - name: Build
        run: dotnet build LumenMedia.slnx -c Release --no-restore

      - name: Test
        run: dotnet test LumenMedia.slnx -c Release --no-build --verbosity normal

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t lumenmedia-server:ci .
